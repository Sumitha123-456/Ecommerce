<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangGraph - Ecommerce Bot</title>

    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ startOnLoad: true });
    </script>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f5f5f5;
            margin:0;
            padding:40px;
        }

        h1{
            text-align:center;
            color:#333;
        }

        .container{
            max-width:1000px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.15);
        }

        .mermaid{
            text-align:center;
        }
    </style>
</head>
<body>

<div class="container">

<h1>🛒 Ecommerce AI LangGraph</h1>

<div class="mermaid">

flowchart TD

A([START])

B[Load Products<br>MongoDB]

C[Load Orders<br>MongoDB]

D{Router}

E[Chat Node]

F[Product Node]

G[Order Node]

H([END])

A --> B
B --> C
C --> D

D -->|General Question| E
D -->|Product Query| F
D -->|Order Query| G

E --> H
F --> H
G --> H

</div>

</div>

</body>
</html>
