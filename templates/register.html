<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow mx-auto"
         style="max-width:500px;">

        <div class="card-body">

            <h2 class="text-center mb-4">
                Create Account
            </h2>

            <form method="POST">

                <div class="mb-3">
                    <label>Username</label>

                    <input type="text"
                           class="form-control"
                           name="username"
                           required>
                </div>

                <div class="mb-3">
                    <label>Password</label>

                    <input type="password"
                           class="form-control"
                           name="password"
                           required>
                </div>

                <button class="btn btn-success w-100">
                    Register
                </button>

            </form>

            <p class="text-center mt-3">

                Already Registered?

                <a href="/login">
                    Login
                </a>

            </p>

        </div>

    </div>

</div>

</body>
</html>
