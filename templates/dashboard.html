<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <span class="navbar-brand">
            E-Commerce Store
        </span>

        <div>
<a href="/admin" class="btn btn-success">
    Admin Panel
</a>

            <a href="/cart" class="btn btn-warning">
                Cart
            </a>

            <a href="/orders" class="btn btn-info">
                Orders
            </a>

            <a href="/logout" class="btn btn-danger">
                Logout
            </a>
            <button onclick="toggleChat()">
    💬 Ask AI
</button>

        </div>

    </div>
</nav>

<div class="container mt-4">

    <div class="row">

        {% for p in products %}

        <div class="col-md-4">

            <div class="card shadow mb-4">

                {% if p.image %}
                <img src="{{ url_for('static', filename='uploads/' + p.image) }}"
                     class="card-img-top"
                     style="height:250px; object-fit:cover;">
                {% else %}
                <img src="https://via.placeholder.com/300x200"
                     class="card-img-top">
                {% endif %}

                <div class="card-body">

                    <h5>{{ p.name }}</h5>

                    <p>{{ p.description }}</p>

                    <h4>₹{{ p.price }}</h4>

                    <a href="/add_to_cart/{{ p._id }}"
                       class="btn btn-success">
                        Add To Cart
                    </a>

                </div>

            </div>

        </div>

        {% endfor %}
{% for product in products %}
<div class="product-card">
    <img src="{{ url_for('static', filename='uploads/' + product.image) }}">
    <h3>{{ product.name }}</h3>
</div>
{% endfor %}
<div id="chatBox" style="display:none;">
    <input type="text" id="userMessage">
    <button onclick="sendMessage()">Send</button>

    <div id="chatResponse"></div>
</div>
    </div>

</div>
<script>
function toggleChat() {
    const box = document.getElementById("chatBox");
    box.style.display =
        box.style.display === "none"
            ? "block"
            : "none";
}

async function sendMessage() {

    const message =
        document.getElementById("userMessage").value;

    const response = await fetch("/ai-chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            message: message
        })
    });

    const data = await response.json();

    document.getElementById("chatResponse")
        .innerHTML = data.reply;
}
</script>

</body>
</html>
