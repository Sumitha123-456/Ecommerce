<!DOCTYPE html>
<html>
<head>
    <title>Order History</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <span class="navbar-brand">
            Order History
        </span>

        <a href="/"
           class="btn btn-light">
            Home
        </a>

    </div>

</nav>

<div class="container mt-4">

    <h2 class="mb-4">
        My Orders
    </h2>

    {% if orders %}

    <table class="table table-bordered table-striped">

        <thead>

            <tr>

                <th>User</th>
                <th>Product ID</th>

            </tr>

        </thead>

        <tbody>

        {% for order in orders %}

            <tr>

                <td>{{ order.user }}</td>

                <td>{{ order.product_id }}</td>

            </tr>

        {% endfor %}

        </tbody>

    </table>

    {% else %}

        <div class="alert alert-info">

            No Orders Found

        </div>

    {% endif %}

</div>

</body>
</html>
