<!DOCTYPE html>
<html>
<head>
    <title>Products</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-BVEP36GDMB"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-BVEP36GDMB');
</script>

    <style>
        #chatBox {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 350px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.2);
            z-index: 9999;
        }

        #chatResponse {
            margin-top: 100px;
            max-height: 500px;
            overflow-y: auto;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <span class="navbar-brand">
            E-Commerce 
            Watch Store
        </span>

        <div>

            <a href="/admin" class="btn btn-success">
                Admin Panel
            </a>

            <a href="/cart" class="btn btn-warning">
                Cart
            </a>

            <a href="/orders" class="btn btn-info">
                Orders
            </a>
             <a href="/logout" class="btn btn-info">
                logout
            </a>
            <button onclick="toggleChat()" class="btn btn-primary">
                💬 Ask AI
            </button>
            <a href="/langgraph" class="btn btn-primary">
    🧠 LangGraph
</a>

        </div>

    </div>
</nav>

<div class="container mt-4">

    <div class="row">

        {% for p in products %}

        <div class="col-md-4">

            <div class="card shadow mb-4">

                {% if p.image %}
                <img
                    src="{{ url_for('static', filename='uploads/' + p.image) }}"
                    class="card-img-top"
                    style="height:250px; object-fit:cover;">
                {% else %}
                <img
                    src="https://via.placeholder.com/300x200"
                    class="card-img-top">
                {% endif %}

                <div class="card-body">

                    <h5>{{ p.name }}</h5>

                    <p>{{ p.description }}</p>

                    <h4>₹{{ p.price }}</h4>

                    <a href="/add_to_cart/{{ p._id }}"
                       class="btn btn-success">
                        Add To Cart
                    </a>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

<!-- AI CHAT BOX -->

<div id="chatBox">

    <div class="d-flex justify-content-between align-items-center mb-2">
        <h5>AI Watch Assistant</h5>

        <button
            class="btn btn-sm btn-danger"
            onclick="toggleChat()">
            X
        </button>
    </div>

    <input
        type="text"
        id="userMessage"
        class="form-control"
        placeholder="Ask about watches...">



        

    <button
        class="btn btn-primary mt-2 w-100"
        onclick="sendMessage()">
        Send
    </button>

    <div id="chatResponse"></div>

</div>

<script>

function toggleChat() {

    const box = document.getElementById("chatBox");

    if (box.style.display === "none" || box.style.display === "") {
        box.style.display = "block";
    } else {
        box.style.display = "none";
    }
}

async function sendMessage() {

    const input =
        document.getElementById("userMessage");

    const message = input.value.trim();

    if (!message) {
        return;
    }

    document.getElementById("chatResponse").innerHTML =
        "<b>You:</b> " + message + "<br><br>Thinking...";

    try {

        const response = await fetch("/ai-chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message
            })

        });

        const data = await response.json();

        document.getElementById("chatResponse").innerHTML =
            "<b>You:</b> " +
            message +
            "<br><br><b>AI:</b> " +
            data.reply;

    } catch (error) {

        document.getElementById("chatResponse").innerHTML =
            "Error connecting to AI assistant.";

        console.error(error);
    }

    input.value = "";
}

document
.getElementById("userMessage")
.addEventListener("keypress", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

</script>

</body>
</html>
