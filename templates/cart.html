<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
          <!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-BVEP36GDMB"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-BVEP36GDMB');
</script>
</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <span class="navbar-brand">
            My Cart
        </span>

        <a href="/"
           class="btn btn-light">
            Continue Shopping
        </a>

    </div>

</nav>

<div class="container mt-4">

    <h2 class="mb-4">
        Cart Items
    </h2>

    {% if items %}

        <div class="row">

        {% for item in items %}

        <div class="col-md-4">

            <div class="card shadow mb-4">

                <img src="https://via.placeholder.com/300x200"
                     class="card-img-top">

                <div class="card-body">

                    <h5>{{ item.name }}</h5>

                    <p>{{ item.description }}</p>

                    <h4>₹{{ item.price }}</h4>

                    <a href="/remove_cart/{{ item._id }}"
                       class="btn btn-danger">
                       Remove
                    </a>

                </div>

            </div>

        </div>

        {% endfor %}

        </div>

        <div class="text-center">

            <a href="/place_order"
               class="btn btn-success btn-lg">
                Place Order
            </a>

        </div>

    {% else %}

        <div class="alert alert-warning">

            Your Cart Is Empty

        </div>

    {% endif %}

</div>

</body>
</html>
